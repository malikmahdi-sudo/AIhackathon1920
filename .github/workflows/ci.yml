name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Offline tests
        run: npm test
      - name: Production build and TypeScript validation
        run: npm run build
      - name: Type check test and application code
        run: npm run typecheck
      - name: Prepare standalone release
        run: npm run package:release
      - name: Smoke test the production release
        run: npm run test:release
      - name: Archive verified release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf morning-paper-linux.tar.gz -C .next/release .
      - name: Upload verified release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morning-paper-linux-${{ github.sha }}
          path: morning-paper-linux.tar.gz
          if-no-files-found: error
          retention-days: 7
